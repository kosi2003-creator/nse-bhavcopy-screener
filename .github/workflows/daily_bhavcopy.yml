name: Daily NSE Bhavcopy Filter

on:
  schedule:
    # Runs at 13:30 UTC (7:00 PM IST) Monday through Friday
    - cron: '30 13 * * 1-5'
  workflow_dispatch: # Allows you to click "Run workflow" manually anytime

permissions:
  contents: write

jobs:
  fetch-and-filter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas yfinance curl_cffi

      - name: Run Bhavcopy script
        run: python auto_bhavcopy.py

      - name: Save CSV report to repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/ mcap_master_cache.csv || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Add filtered Bhavcopy report"
          git push
